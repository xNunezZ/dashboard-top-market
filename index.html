<style>
  :root{--roxo:#5B41C4; --verde:#12F06B; --fundo:#F4F1FB; --texto:#1E1340; --sub:#6B6390; --borda:#DCD5F2; --erro:#C4314B}
  @media (prefers-color-scheme: dark){ :root{--fundo:#0F0817; --texto:#F3EFFA; --sub:#B3A9CC; --borda:#3A2C5C; --erro:#FF8FA3} }
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
       background:var(--fundo); color:var(--texto); font-family:'Inter',system-ui,sans-serif}
  .caixa{width:100%; max-width:380px}
  .marca{display:flex; align-items:center; gap:10px; margin-bottom:28px}
  .marca svg{width:40px; height:40px}
  .marca b{font-family:'Outfit',sans-serif; font-size:24px; font-weight:700}
  .marca span{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--sub); border-left:1px solid var(--borda); padding-left:10px}
  h1{font-family:'Outfit',sans-serif; font-size:22px; font-weight:600; margin:0 0 6px}
  p{margin:0 0 22px; color:var(--sub); font-size:14px; line-height:1.5}
  label{display:block; font-size:13px; font-weight:500; margin-bottom:6px}
  input[type=password]{width:100%; font:inherit; font-size:16px; padding:12px 14px; border-radius:12px;
       border:1.5px solid var(--borda); background:transparent; color:var(--texto)}
  input[type=password]:focus{outline:none; border-color:var(--roxo); box-shadow:0 0 0 3px rgba(91,65,196,.18)}
  .lembrar{display:flex; align-items:center; gap:8px; margin:14px 0 18px; font-size:13px; color:var(--sub)}
  button{width:100%; font-family:'Outfit',sans-serif; font-size:15px; font-weight:600; padding:13px; border:0;
       border-radius:12px; background:var(--roxo); color:#fff; cursor:pointer; min-height:48px}
  button:hover{filter:brightness(1.08)} button:disabled{opacity:.6; cursor:wait}
  #msg{min-height:20px; margin-top:12px; font-size:13px; color:var(--erro)}
</style></head>

const LS = "radu_tm_senha";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:b64(PACOTE.sal), iterations:PACOTE.it},
                                              base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PACOTE.iv)}, chave, b64(PACOTE.dado));
  return new TextDecoder().decode(claro);
}
function mostrar(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), msg = document.getElementById("msg"), btn = document.getElementById("entrar");

/* Limite de tentativas: 5 livres, depois espera de 30 s que dobra a cada erro (até 1 h).
   Freia quem tenta na mão. Quem baixa o arquivo e testa fora do site não passa por aqui —
   contra esse, o que vale são as 600 mil rodadas do PBKDF2 e uma senha forte. */
const LS_T = "radu_tm_tentativas", LIVRES = 5;
const lerT = () => { try{ return JSON.parse(localStorage.getItem(LS_T)) || {n:0, ate:0}; }catch(e){ return {n:0, ate:0}; } };
const gravarT = t => { try{ localStorage.setItem(LS_T, JSON.stringify(t)); }catch(e){} };
let relogio = null;
function aguardar(){
  const t = lerT(), falta = Math.ceil((t.ate - Date.now())/1000);
  if(falta <= 0){ btn.disabled = false; btn.textContent = "Entrar"; if(relogio){ clearInterval(relogio); relogio = null; } return false; }
  btn.disabled = true; btn.textContent = "Aguarde " + (falta >= 60 ? Math.ceil(falta/60) + " min" : falta + " s");
  msg.textContent = "Muitas tentativas erradas. Aguarde para tentar de novo.";
  if(!relogio) relogio = setInterval(aguardar, 1000);
  return true;
}
aguardar();

  const senha = document.getElementById("senha").value;

    const html = await abrir(senha);
    gravarT({n:0, ate:0});
    try{ if(document.getElementById("lembrar").checked) localStorage.setItem(LS, senha); else localStorage.removeItem(LS); }catch(e){}
    mostrar(html);
  }catch(e){
    const t = lerT(); t.n += 1;
    if(t.n >= LIVRES) t.ate = Date.now() + Math.min(3600, 30 * 2 ** (t.n - LIVRES)) * 1000;
    gravarT(t);
    btn.disabled = false; btn.textContent = "Entrar";
    const restam = LIVRES - t.n;
    msg.textContent = restam > 0 ? `Senha incorreta. ${restam} tentativa(s) antes de uma pausa.` : "";
    aguardar();
  }
});
(async () => {                       // senha lembrada: entra direto
  let s = null; try{ s = localStorage.getItem(LS); }catch(e){}
  if(!s) return;
  try{ mostrar(await abrir(s)); }catch(e){ try{ localStorage.removeItem(LS); }catch(_){} }  // senha trocada
})();
</script>
